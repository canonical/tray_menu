name: tray_menu
description: A Flutter plugin for system tray icons and menus on Linux, macOS and Windows.
version: 0.1.0
homepage: https://github.com/canonical/tray_menu

environment:
  sdk: '>=3.0.3 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: TrayMenuPlugin
      macos:
        pluginClass: TrayMenuPlugin
      windows:
        pluginClass: TrayMenuPluginCApi
